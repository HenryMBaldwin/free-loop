[workspace]
members = ["crates/core", "crates/engine", "crates/audio", "crates/surface"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/henrymbaldwin/free-loop"
keywords = ["looper", "launchpad", "audio", "midi", "dawless"]
categories = ["multimedia::audio"]

[workspace.dependencies]
cpal = "0.18"
free-loop-core = { path = "crates/core", version = "0.1.0" }
free-loop-engine = { path = "crates/engine", version = "0.1.0" }
launchy = { git = "https://github.com/HenryMBaldwin/launchy", rev = "9fc6d1be35bd78cca5ad165742a622fc70e8f46d" }
rtrb = "0.3"
thiserror = "2"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
# missing_docs = "warn"
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
